<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMC TDA 教學設計輔助工具提詞器 (Teaching Design Aids Prompt Builder)</title>
    
    <!--
        ⚠️ Tailwind Play CDN：single-file project trade-off
        Production warning 接受 — 換取零 build step，分享即用
        之後如要 production-grade，可改用 Tailwind CLI precompile
    -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>

    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

    <!-- Override react preset 用 classic runtime — 避免 file:// 環境下 jsx-runtime bare specifier 解析失敗 -->
    <script>
        (function () {
            if (typeof Babel === 'undefined' || !Babel.availablePresets) {
                console.error('[TDA] Babel not loaded, cannot patch preset');
                return;
            }
            // Wrap preset-react factory — inject runtime: 'classic'
            const originalReact = Babel.availablePresets.react;
            Babel.availablePresets.react = function (api, options, dirname) {
                return originalReact.call(this, api, { ...(options || {}), runtime: 'classic' }, dirname);
            };
            console.log('[TDA] react preset patched to classic runtime (no jsx-runtime imports)');
        })();
    </script>

    <!-- DOCX Library for Word Export -->
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* === Design Tokens (統一 spacing / shadow / transition) === */
        :root {
            /* Spacing scale — 8px 為基數 (phase 2.3.1) */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;
            --space-8: 32px;
            --space-12: 48px;
            --space-16: 64px;

            /* Shadow scale — 4 級 elevation (phase 2.3.2) */
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);

            /* Transition curve — 統一互動節奏 (phase 2.3.3) */
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: 150ms var(--ease-out);
            --transition-base: 250ms var(--ease-out);
            --transition-slow: 400ms var(--ease-out);

            /* Cyber theme glow */
            --cyber-glow: 0 0 20px rgba(6,182,212,0.4);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            transition: background-color var(--transition-base), color var(--transition-base);
        }

        /* Phase 3.4.3: Loading skeleton pulse */
        @keyframes skeleton-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .skeleton {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: skeleton-pulse 1.5s var(--ease-out) infinite;
        }
        body.theme-plain .skeleton {
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.05), transparent);
            background-size: 200% 100%;
        }

        /* Phase 3.4.1: Category button ripple effect */
        @keyframes ripple {
            from { transform: scale(0); opacity: 0.6; }
            to { transform: scale(2.5); opacity: 0; }
        }
        .ripple-effect {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            transform: scale(0);
        }
        .ripple-effect:active::before {
            animation: ripple 0.6s var(--ease-out);
        }

        /* --- Cyber Theme Styles --- */
        body.theme-cyber {
            background-color: #020617; /* Slate 950 */
            color: #e2e8f0; /* Slate 200 */
        }

        /* === Phase 2.3.2: Shadow utility classes === */
        .shadow-token-sm { box-shadow: var(--shadow-sm); }
        .shadow-token-md { box-shadow: var(--shadow-md); }
        .shadow-token-lg { box-shadow: var(--shadow-lg); }
        .shadow-token-xl { box-shadow: var(--shadow-xl); }

        /* === Phase 2.3.3: Transition utility classes === */
        .transition-token-fast { transition: all var(--transition-fast); }
        .transition-token-base { transition: all var(--transition-base); }
        .transition-token-slow { transition: all var(--transition-slow); }

        /* === Phase 2.3.1: Spacing token aliases ===
           將常用 spacing 對齊 design token 8px scale
           視覺輸出同 Tailwind p-2/p-3/p-4 完全一致（已經係 8/12/16px），
           只係 class name 改做 token-aligned（將來 full migration 易搵）

           Migration guide:
             p-2 → p-token-2 (8px)
             p-3 → p-token-3 (12px)
             p-4 → p-token-4 (16px)
             p-6 → p-token-6 (24px)
             gap-2 → gap-token-2 (8px)
             gap-3 → gap-token-3 (12px)
             space-y-4 → space-y-token-4 (16px)
             etc.

           Current migrated (selective swap 2026-06-26):
             - Category buttons: p-3 → p-token-3
             - Live preview textarea: p-4 → p-token-4
             - CoachMark modal: p-6 → p-token-6

           Future work: full sed replace via CI script，保留 visual 100% identical.

           ✓ Done 2026-06-26: Full sed migration applied (248 replacements via /tmp/tda_spacing_migrate.py).
             Remaining: p-5 (intentional, 20px 唔係 8px scale).
        */
        .p-token-1 { padding: var(--space-1); }
        .p-token-2 { padding: var(--space-2); }
        .p-token-3 { padding: var(--space-3); }
        .p-token-4 { padding: var(--space-4); }
        .p-token-6 { padding: var(--space-6); }
        .p-token-8 { padding: var(--space-8); }

        .px-token-1 { padding-left: var(--space-1); padding-right: var(--space-1); }
        .px-token-2 { padding-left: var(--space-2); padding-right: var(--space-2); }
        .px-token-3 { padding-left: var(--space-3); padding-right: var(--space-3); }
        .px-token-4 { padding-left: var(--space-4); padding-right: var(--space-4); }

        .py-token-1 { padding-top: var(--space-1); padding-bottom: var(--space-1); }
        .py-token-2 { padding-top: var(--space-2); padding-bottom: var(--space-2); }
        .py-token-3 { padding-top: var(--space-3); padding-bottom: var(--space-3); }
        .py-token-4 { padding-top: var(--space-4); padding-bottom: var(--space-4); }

        .m-token-1 { margin: var(--space-1); }
        .m-token-2 { margin: var(--space-2); }
        .m-token-3 { margin: var(--space-3); }
        .m-token-4 { margin: var(--space-4); }
        .m-token-6 { margin: var(--space-6); }

        .gap-token-1 { gap: var(--space-1); }
        .gap-token-2 { gap: var(--space-2); }
        .gap-token-3 { gap: var(--space-3); }
        .gap-token-4 { gap: var(--space-4); }
        .gap-token-6 { gap: var(--space-6); }

        .space-y-token-1 > * + * { margin-top: var(--space-1); }
        .space-y-token-2 > * + * { margin-top: var(--space-2); }
        .space-y-token-3 > * + * { margin-top: var(--space-3); }
        .space-y-token-4 > * + * { margin-top: var(--space-4); }
        .space-y-token-6 > * + * { margin-top: var(--space-6); }

        /* Cyber Grid Background */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 200vw;
            height: 200vh;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: grid-move 20s linear infinite;
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        body.theme-cyber .cyber-grid {
            opacity: 1;
        }

        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        /* Vignette Effect */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, #020617 100%);
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        body.theme-cyber .vignette {
            opacity: 1;
        }

        /* Scrollbar - Conditional styling via CSS variables or specific overrides */
        body.theme-cyber textarea::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        body.theme-cyber textarea::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; border: 1px solid #06b6d4; }
        body.theme-cyber textarea::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

        body.theme-plain textarea::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        body.theme-plain textarea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        body.theme-plain textarea::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        textarea::-webkit-scrollbar { width: 8px; }

        /* Holographic Gradient Animation */
        @keyframes gradient-xy {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-holo {
            background-size: 200% 200%;
            animation: gradient-xy 3s ease infinite;
        }

        /* Text Glows - Only in Cyber Mode */
        body.theme-cyber .text-glow-cyan {
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.5), 0 0 10px rgba(6, 182, 212, 0.3);
        }
        body.theme-cyber .text-glow-purple {
            text-shadow: 0 0 5px rgba(168, 85, 247, 0.5), 0 0 10px rgba(168, 85, 247, 0.3);
        }

        /* Tech Borders - Cyber Mode */
        .tech-border {
            position: relative;
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(6, 182, 212, 0.3); 
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        /* Tech Input - Cyber Mode */
        .tech-input {
            background: rgba(30, 41, 59, 0.5); 
            border: 1px solid #334155;
            color: #ecfeff;
            transition: all 0.3s ease;
        }
        .tech-input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
            background: rgba(30, 41, 59, 0.8);
        }

        /* --- Plain Theme Styles --- */
        body.theme-plain {
            background-color: #f8fafc; /* Slate 50 */
            color: #1e293b; /* Slate 800 */
        }

        .plain-border {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .plain-input {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            transition: all 0.3s ease;
        }
        .plain-input:focus {
            border-color: #3b82f6; /* Blue 500 */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .mono {
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>
<body class="selection:bg-cyan-500 selection:text-white transition-colors duration-500">
    <!-- Background Elements (Only visible in Cyber theme) -->
    <div class="cyber-grid"></div>
    <div class="vignette"></div>
    
    <div id="root"></div>

    <!-- React Application Script -->
    <!--
        用 classic JSX transform（唔係 automatic JSX runtime）— 原因：
        - Automatic runtime 會 emit `import 'react/jsx-runtime'`（bare specifier）
        - 喺 file:// 環境下 browser 解析唔到 bare specifier
        - Classic transform emit `React.createElement(...)`，只需要 React import，絕對 URL OK
    -->
    <script type="text/babel" data-type="module" data-presets="react">
// FIX: Explicitly defined dependencies to ensure a singleton React instance
        // 使用 esm.sh ?bundle-deps mode — 將 transitive deps (包括 react/jsx-runtime) inline 為絕對 URL，
        // 解決 file:// 環境下 bare specifier "react/jsx-runtime" 解析失敗嘅問題
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { motion, AnimatePresence } from 'https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0,react-dom@18.2.0&bundle-deps';
        import {
            BookOpen,
            Gamepad2,
            HeartHandshake,
            MessageCircle,
            FlaskConical,
            ChevronRight,
            ChevronLeft,
            Copy,
            CheckCircle,
            Wand2,
            Settings2,
            UserCircle,
            Sparkles,
            Save,
            RotateCcw,
            Plus,
            Trash2,
            Monitor,
            Bot,
            Cpu,
            Zap,
            Accessibility,
            ExternalLink,
            Sun,
            Moon,
            Github,
            FileJson,
            FileText,
            Upload,
            AlertCircle,
            Code, // Added Code icon here
            Eye // 用於 live preview 面板
        } from 'https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0,react-dom@18.2.0&bundle-deps';

        // --- Components ---

        const Card = ({ children, className = "", theme }) => (
            <div className={`rounded-2xl overflow-hidden ${theme === 'cyber' ? 'tech-border' : 'plain-border'} ${className}`}>
                {children}
            </div>
        );

        // === Visual Hierarchy: Label component ===
        // required / optional 標記，更清晰嘅視覺層次
        // props: required (boolean), optional (boolean)
        const Label = ({ children, theme, required, optional }) => (
            <label className={`block text-sm font-bold mb-2 flex items-center gap-token-2 ${
                theme === 'cyber'
                ? 'text-cyan-300 tracking-wide uppercase orbitron'
                : 'text-slate-700 tracking-normal'
            }`}>
                <span className={`w-1 h-4 rounded-sm inline-block ${theme === 'cyber' ? 'bg-cyan-500' : 'bg-blue-600'}`}></span>
                {children}
                {required && (
                    <span className="text-red-500 text-base" title="必填">*</span>
                )}
                {optional && !required && (
                    <span className={`text-xs px-token-1.5 py-0.5 rounded font-normal ${
                        theme === 'cyber' ? 'bg-slate-700 text-slate-400' : 'bg-slate-200 text-slate-600'
                    }`}>選填</span>
                )}
            </label>
        );

        const Input = (props) => {
            const { theme, className, ...rest } = props;
            return (
                <input 
                    className={`w-full px-token-4 py-token-3 rounded-xl outline-none ${theme === 'cyber' ? 'tech-input' : 'plain-input'} ${className || ""}`}
                    {...rest} 
                />
            );
        };

        const TextArea = (props) => {
            const { theme, className, ...rest } = props;
            return (
                <textarea
                    className={`w-full px-token-4 py-token-3 rounded-xl outline-none min-h-[120px] ${theme === 'cyber' ? 'tech-input' : 'plain-input'} ${className || ""}`}
                    {...rest}
                />
            );
        };

        // 可摺疊 section header — Step 1 拆 sub-section 用
        const CollapsibleSection = ({ title, badge, isOpen, onToggle, theme, children, hint }) => (
            <div className={`rounded-xl border ${theme === 'cyber' ? 'border-slate-700/50 bg-slate-800/20' : 'border-slate-200 bg-white'} overflow-hidden`}>
                <button
                    type="button"
                    onClick={onToggle}
                    className={`w-full flex items-center justify-between p-token-4 transition-colors ${
                        theme === 'cyber' ? 'hover:bg-slate-800/50' : 'hover:bg-slate-50'
                    }`}
                    aria-expanded={isOpen}
                >
                    <div className="flex items-center gap-token-3">
                        <ChevronRight
                            size={18}
                            className={`transition-transform duration-200 ${
                                isOpen ? 'rotate-90' : ''
                            } ${theme === 'cyber' ? 'text-cyan-400' : 'text-slate-500'}`}
                        />
                        <span className={`font-bold text-sm tracking-wide ${
                            theme === 'cyber' ? 'text-cyan-200 orbitron' : 'text-slate-800'
                        }`}>{title}</span>
                        {badge && (
                            <span className={`text-xs px-token-2 py-0.5 rounded-full ${
                                theme === 'cyber' ? 'bg-cyan-900/40 text-cyan-300' : 'bg-blue-100 text-blue-700'
                            }`}>{badge}</span>
                        )}
                    </div>
                    {hint && (
                        <span className={`text-xs hidden md:inline ${theme === 'cyber' ? 'text-slate-400' : 'text-slate-500'}`}>{hint}</span>
                    )}
                </button>
                {isOpen && (
                    <div className={`p-token-4 border-t ${theme === 'cyber' ? 'border-slate-700/50 bg-slate-900/30' : 'border-slate-100 bg-slate-50/50'}`}>
                        {children}
                    </div>
                )}
            </div>
        );

        // === Quality Score 元件 ===
        // 顏色按 grade 變：excellent / good / fair / poor
        const scoreColor = (grade, theme) => {
            if (theme === 'cyber') {
                return {
                    excellent: 'bg-emerald-900/40 text-emerald-300 border-emerald-500/50',
                    good:      'bg-cyan-900/40 text-cyan-300 border-cyan-500/50',
                    fair:      'bg-amber-900/40 text-amber-300 border-amber-500/50',
                    poor:      'bg-red-900/40 text-red-300 border-red-500/50',
                }[grade];
            }
            return {
                excellent: 'bg-emerald-100 text-emerald-800 border-emerald-400',
                good:      'bg-blue-100 text-blue-800 border-blue-400',
                fair:      'bg-amber-100 text-amber-800 border-amber-400',
                poor:      'bg-red-100 text-red-800 border-red-400',
            }[grade];
        };
        const scoreEmoji = (grade) => ({ excellent: '🌟', good: '👍', fair: '⚠️', poor: '🔴' })[grade];

        const QualityScoreBadge = ({ theme, score, onClick }) => (
            <button
                onClick={onClick}
                className={`px-token-3 py-token-2 rounded-xl font-bold text-sm border transition-all hover:scale-105 ${scoreColor(score.grade, theme)}`}
                title="Click 睇詳細評分"
            >
                <span className="mr-1">{scoreEmoji(score.grade)}</span>
                質素 {score.total}/100 · {score.gradeLabel}
            </button>
        );

        const QualityScoreDetail = ({ theme, score, onClose }) => {
            const maxScores = {
                completeness: 30, clarity: 25, senFit: 15, rulesDetail: 15, examples: 15,
            };
            const labels = {
                completeness: '完整性', clarity: '明確度', senFit: 'SEN 適配', rulesDetail: '規則具體度', examples: '範例題目',
            };
            return (
                <Card theme={theme} className="p-token-6">
                    <div className="flex items-center justify-between mb-4">
                        <h3 className={`text-lg font-bold ${theme === 'cyber' ? 'text-cyan-200 orbitron' : 'text-slate-800'}`}>
                            {scoreEmoji(score.grade)} 質素評分詳情 · {score.total}/100
                        </h3>
                        <button
                            onClick={onClose}
                            className={`px-token-3 py-token-1 rounded-lg text-sm ${theme === 'cyber' ? 'text-slate-400 hover:bg-slate-800' : 'text-slate-500 hover:bg-slate-100'}`}
                        >✕</button>
                    </div>
                    {/* 維度條 */}
                    <div className="space-y-token-3 mb-4">
                        {Object.entries(score.breakdown).map(([key, value]) => (
                            <div key={key}>
                                <div className="flex justify-between text-sm mb-1">
                                    <span className={theme === 'cyber' ? 'text-slate-300' : 'text-slate-700'}>{labels[key]}</span>
                                    <span className={theme === 'cyber' ? 'text-cyan-400 orbitron' : 'text-blue-600 font-bold'}>{value} / {maxScores[key]}</span>
                                </div>
                                <div className={`h-2 rounded-full overflow-hidden ${theme === 'cyber' ? 'bg-slate-800' : 'bg-slate-200'}`}>
                                    <div
                                        className={`h-full transition-all ${
                                            value / maxScores[key] >= 0.8 ? 'bg-emerald-500' :
                                            value / maxScores[key] >= 0.5 ? 'bg-cyan-500' :
                                            value / maxScores[key] >= 0.3 ? 'bg-amber-500' :
                                            'bg-red-500'
                                        }`}
                                        style={{ width: `${(value / maxScores[key]) * 100}%` }}
                                    />
                                </div>
                            </div>
                        ))}
                    </div>
                    {/* 改善建議 */}
                    {score.suggestions.length > 0 && (
                        <div>
                            <h4 className={`text-sm font-bold mb-2 ${theme === 'cyber' ? 'text-cyan-300' : 'text-slate-700'}`}>
                                💡 改善建議 ({score.suggestions.length})
                            </h4>
                            <div className="space-y-token-2">
                                {score.suggestions.map((s, i) => (
                                    <div
                                        key={i}
                                        className={`p-token-3 rounded-lg border text-sm ${
                                            s.severity === 'warning'
                                                ? (theme === 'cyber' ? 'bg-red-900/20 border-red-500/30 text-red-200' : 'bg-red-50 border-red-200 text-red-700')
                                                : (theme === 'cyber' ? 'bg-amber-900/20 border-amber-500/30 text-amber-200' : 'bg-amber-50 border-amber-200 text-amber-700')
                                        }`}
                                    >
                                        <div className="font-bold">{s.message}</div>
                                        {s.detail && <div className="text-xs opacity-80 mt-1">{s.detail}</div>}
                                        <div className="text-xs mt-1">{s.improvement}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </Card>
            );
        };

        // === AI API Settings Modal ===
        // 老師設定 Gemini API key（純 localStorage，唔上傳任何 server）
        const ApiSettingsModal = ({ theme, currentKey, onSave, onClose }) => {

        // required: true ＝ import 必須有呢個 field（否則 throw）
        // required: false ＝ import 冇呢個 field 會用 default forward-fill
        const SCHEMA_VERSION = 2;

        const formatTimeAgo = (timestamp) => {

            if (seconds < 60) return `${seconds} 秒前`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} 分鐘前`;
            const hours = Math.floor(minutes / 60);

            useGeminiStyle:          { type: 'boolean', required: false }, // v1 叫 isGemini
            fabStyle:                { type: 'string', required: false },  // 新增

        // Migration map — 由舊 field name / structure migrate 到 v2 shape
        // Key 係 source key（如果係 object 形式）或 source path；value 係 transformer
        const FIELD_RENAMES = {
            isGemini: 'useGeminiStyle', // v1 → v2: isGemini rename
        };

        // v1 → v2 field-level migration transformers
        // 用嚟處理 value 結構轉換（例如 array → string）
        const FIELD_TRANSFORMS = {
            gameStyle: (value) => {
                // v1 係 array, v2 係 string
                if (Array.isArray(value) && value.length > 0) {
                    return value[0];

                return value;

        // 唔做 deep recursive validation（太複雜），只做 top-level type check
        const matchesType = (value, type) => {
            switch (type) {
                case 'string':  return typeof value === 'string';
                case 'number':  return typeof value === 'number' && !Number.isNaN(value);
                case 'boolean': return typeof value === 'boolean';
                case 'array':   return Array.isArray(value);
                case 'object':  return typeof value === 'object' && value !== null && !Array.isArray(value);
                default:        return true;
            }

        // Pure migration function — 將任何 imported JSON normalize 到當前 schema
        // 策略：
        //   1. 唔係 object 就 throw
        //   2. Rename legacy fields（FIELD_RENAMES map）
        //   3. Type validation — 唔啱 type 就 log warning + fallback 到 default（唔 throw，保留寬容）
        //   4. Required field 缺失 → throw（明確失敗）
        //   5. Forward-fill 所有 default field（用 getInitialFormData() 嘅 default）
        //   6. 保留未知 field 喺 __legacy_extra（debug 用，老師亦可睇到）
        //   7. 喺 migrated 物件加 __schema_version metadata
        const migrateFormData = (input) => {
            if (!input || typeof input !== 'object' || Array.isArray(input)) {
                throw new Error("JSON 必須係 object（唔可以係 array 或純值）。");
            }

            const errors = [];
            const warnings = [];
            const migrated = {};
            const extra = {};

            // 1. Apply field renames + collect values
            const renamedInput = { ...input };
            Object.entries(FIELD_RENAMES).forEach(([oldKey, newKey]) => {
                if (oldKey in renamedInput && !(newKey in renamedInput)) {
                    renamedInput[newKey] = renamedInput[oldKey];
                    delete renamedInput[oldKey];
                    warnings.push(`自動將舊欄位「${oldKey}」轉成新欄位「${newKey}」`);
                }
            });

            // 2. Process each schema field
            Object.entries(FORM_SCHEMA).forEach(([key, spec]) => {
                if (key in renamedInput) {
                    let value = renamedInput[key];

                    // Apply value-level transformer (e.g. array → string)
                    if (FIELD_TRANSFORMS[key]) {
                        const original = value;
                        value = FIELD_TRANSFORMS[key](value);
                        if (original !== value) {
                            warnings.push(`「${key}」已從舊結構轉換成新結構`);
                        }
                    }

                    if (matchesType(value, spec.type)) {
                        migrated[key] = value;
                    } else {
                        // Type mismatch — fallback to default + warn
                        warnings.push(`「${key}」類型不符 (期望 ${spec.type})，已用預設值取代`);
                        // 唔 throw，等 import 仲用得，只係 warn
                    }
                } else if (spec.required) {

        const interpolateTemplate = (template, data) => {
            const subject = data.subjectCategory === '其他' ? (data.subjectCustomInput || '[科目]') : data.subjectCategory;
            const grade = data.grade || '[年級]';
            const senLevel = data.senLevel || '[支援需求]';
            const value = (data.value && data.value.length > 0) ? data.value.join('、') : '良好品格';
            const gameStyle = data.gameStyle || '互動';
            const interaction = (data.interactionType && data.interactionType.length > 0)
                ? data.interactionType.filter(i => i !== '其他').slice(0, 2).join(' / ')
                : '點擊操作';

            return template
                .replace('{subject}', subject)
                .replace('{grade}', grade)
                .replace('{senLevel}', senLevel)
                .replace('{value}', value)
                .replace('{gameStyle}', gameStyle)
                .replace('{interaction}', interaction);
        };

        // 根據 field + formData 拎 candidate list（已經 interpolate）
        const getSuggestions = (field, data) => {

                context: CONTEXT_POOL[data.category] || CONTEXT_POOL['教學工具'],
                rules: RULES_POOL,
            }[field];
            if (!pool) return [];
            return pool.map(t => interpolateTemplate(t, data));
        };

        function App() {

            const [copiedDesign, setCopiedDesign] = useState(false);

            const [showScoreDetail, setShowScoreDetail] = useState(false); // Quality Score detail panel

            // === Onboarding Tour state ===
            // 第一次開頁時逐個 coach mark 提示（5 個 milestones）
            // 儲存喺 localStorage，完成後就唔再彈
            // 0: 範本庫（最開頭）/ 1: step 1 / 2: step 2 / 3: step 3 / 4: step 4
            const ONBOARDING_KEY = 'TDA_ONBOARDING_DONE_V1';
            const ONBOARDING_STEPS = ['templates', 'step1', 'step2', 'step3', 'step4'];
            const [onboardingStep, setOnboardingStep] = useState(null); // index 0-4 or null
            const [onboardingActive, setOnboardingActive] = useState(false); // user 喺 tour 進行中

            useEffect(() => {
                try {
                    const done = localStorage.getItem(ONBOARDING_KEY);
                    if (!done) {
                        // 延遲 1.5s 等 UI render + recovery prompt 都處理完
                        setTimeout(() => {
                            setOnboardingStep(0);
                            setOnboardingActive(true);
                            setStep(1); // 確保喺 step 1
                        }, 1500);
                    }
                } catch {}
            }, []);

            const advanceOnboarding = () => {
                if (onboardingStep === null) return;
                const next = onboardingStep + 1;
                if (next >= ONBOARDING_STEPS.length) {
                    // 完結
                    completeOnboarding();
                    return;
                }
                setOnboardingStep(next);
                // Sync 返去對應嘅 step（step1=1, step2=2, step3=3, step4=4）
                if (next >= 1 && next <= 4) {
                    setStep(next);
                }
            };

            const completeOnboarding = () => {
                try { localStorage.setItem(ONBOARDING_KEY, '1'); } catch {}
                setOnboardingStep(null);
                setOnboardingActive(false);
            };

            // 自動 sync step → coach mark（如果 user click「下一步」就 sync 返）
            // 但要避免 loop：onboarding 唔再 trigger sync 自身
            useEffect(() => {
                if (!onboardingActive) return;
                const targetStep = ONBOARDING_STEPS[onboardingStep];
                if (!targetStep) return;
                if (targetStep.startsWith('step')) {
                    const stepNum = parseInt(targetStep.replace('step', ''));
                    if (stepNum !== step) setStep(stepNum);
                }
            }, [onboardingStep]);

            // === User Templates state ===
            // 老師可以將當前 formData 儲存為自訂範本
            // localStorage key: TDA_USER_TEMPLATES_V1
            // 最多 50 個範本（防止 quota 爆）
            const USER_TEMPLATES_KEY = 'TDA_USER_TEMPLATES_V1';
            const MAX_USER_TEMPLATES = 50;
            const [userTemplates, setUserTemplates] = useState([]);

            // Mount 時讀 localStorage
            useEffect(() => {
                try {
                    const raw = localStorage.getItem(USER_TEMPLATES_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) setUserTemplates(parsed);
                    }
                } catch (err) {
                    console.warn('[TDA] Failed to load user templates:', err);
                }
            }, []);

            // 將當前 formData 儲存為自訂範本
            const saveAsUserTemplate = (name, description) => {
                if (userTemplates.length >= MAX_USER_TEMPLATES) {
                    alert(`範本數量已達上限（${MAX_USER_TEMPLATES} 個）。請先刪除舊範本。`);
                    return false;
                }
                const newTemplate = {
                    id: `user-${Date.now()}`,
                    name,
                    description: description || '',
                    icon: '⭐',
                    category: formData.category,
                    preview: (formData.purpose || formData.toolName || '').substring(0, 60),
                    formData: { ...formData, teacherName: '' }, // 不存 teacherName 私隱
                    isUser: true,
                    createdAt: Date.now(),
                };
                const updated = [...userTemplates, newTemplate];
                setUserTemplates(updated);
                try {
                    localStorage.setItem(USER_TEMPLATES_KEY, JSON.stringify(updated));
                } catch (err) {
                    console.warn('[TDA] Failed to save user template:', err);
                    alert('儲存失敗 — localStorage 可能已滿。請匯出 JSON 備份後清理。');
                    return false;
                }
                return true;
            };

            // 刪除自訂範本
            const deleteUserTemplate = (id) => {
                const updated = userTemplates.filter(t => t.id !== id);
                setUserTemplates(updated);
                try {
                    localStorage.setItem(USER_TEMPLATES_KEY, JSON.stringify(updated));
                } catch (err) {
                    console.warn('[TDA] Failed to delete user template:', err);

            // 載入範本（built-in 或 user）— 經 schema migration pipeline
            const loadTemplate = (template) => {
                // 如果有內容，問老師確認
                const hasContent = (formData.purpose || '').trim() || (formData.toolName || '').trim();
                if (hasContent && !confirm('載入範本會覆蓋現有資料，繼續？')) return;
                // 經 migration pipeline — 確保舊版範本仍能 load
                const migrated = migrateFormData(template.formData);
                const { __schema_version, __legacy_extra, __warnings, ...cleanFormData } = migrated;
                pushHistory(); // milestone: 載入範本
                setFormData(cleanFormData);
                setStep(1); // 跳去 Step 1 畀老師檢視同微調
                if (__warnings.length > 0) {
                    setTimeout(() => alert(`範本已載入。自動處理：\n${__warnings.join('\n')}`), 100);

            };

            // AI Suggestions state
            // activeSuggestionField: null | 'purpose' | 'context' | 'rules'
            // pendingSuggestion: { text, field } 等老師揀「覆蓋/插入/取消」之後 apply
            const [activeSuggestionField, setActiveSuggestionField] = useState(null);
            const [pendingSuggestion, setPendingSuggestion] = useState(null);
            // 用嚟處理老師點擊 candidate 之後 apply 嘅 flow
            const applySuggestion = (field, text) => {
                if (field === 'rules') {
                    // Rules 係 array — 直接 push 落去
                    setFormData(prev => ({
                        ...prev,
                        rules: [...(prev.rules || []).filter(r => r.trim()), text],
                    }));
                } else {
                    // purpose / context 係 string — 需要處理覆蓋/插入/取消
                    const current = (formData[field] || '').trim();
                    if (!current) {
                        // field 空白 → 直接填
                        setFormData(prev => ({ ...prev, [field]: text }));
                    } else {
                        // field 有內容 → 開 confirm dialog
                        setPendingSuggestion({ field, text });
                    }
                }
                setActiveSuggestionField(null);
            };

            const confirmReplace = () => {
                if (!pendingSuggestion) return;
                setFormData(prev => ({ ...prev, [pendingSuggestion.field]: pendingSuggestion.text }));
                setPendingSuggestion(null);
            };
            const confirmAppend = () => {
                if (!pendingSuggestion) return;
                setFormData(prev => ({
                    ...prev,
                    [pendingSuggestion.field]: (prev[pendingSuggestion.field] || '') + '\n' + pendingSuggestion.text,
                }));

                const success = document.execCommand('copy');
                document.body.removeChild(textArea);
                if (!success) {
                    throw new Error('execCommand copy returned false');
                }
            };

            // Handlers for Save JSON and Export DOCX
            const handleSaveJSON = () => {
                // 加入 schema metadata，等 round-trip (save → import) 完整
                const exported = {
                    __schema_version: SCHEMA_VERSION,
                    __exported_at: new Date().toISOString(),
                    ...formData,
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exported, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `tda_data_v${SCHEMA_VERSION}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            const handleExportDOCX = () => {
                const designText = generateDesignPrompt();
                const techText = generateTechPrompt();
                const fullText = designText + "\n\n" + techText;

                if (!window.docx) {
                     alert("DOCX library not loaded. Please try again later.");
                     return;
                }
                const { Document, Packer, Paragraph, TextRun } = window.docx;
                
                const lines = fullText.split('\n');
                const children = lines.map(line => new Paragraph({
                    children: [new TextRun({
                        text: line || " ",
                        // 避免中文變豆腐：用 eastAsia + ascii 分離字型
                        //   - ascii/hAnsi: 拉丁字符 → Arial
                        //   - eastAsia:     中日韓字符 → Microsoft JhengHei
                        // Word / Pages 開都會正確 fallback
                        font: {
                            ascii: "Arial",
                            hAnsi: "Arial",
                            eastAsia: "Microsoft JhengHei",
                        },
                    })],
                    spacing: {
                        after: 200,
                    }
                }));

                const doc = new Document({
                    sections: [{
                        properties: {},
                        children: children,
                    }],
                });

                Packer.toBlob(doc).then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    document.body.appendChild(a);
                    a.href = url;
                    a.download = 'tda_prompt.docx';
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }).catch(err => {
                    console.error(err);
                    alert("匯出 Word 檔案失敗 (Export Failed)");
                });
            };

            const handleImportJSON = (event) => {

                const reader = new FileReader();
                reader.onload = (e) => {
                    let rawJson;
                    try {
                        rawJson = JSON.parse(e.target.result);
                    } catch (parseError) {
                        console.error("JSON parse error:", parseError);
                        alert(`匯入失敗：JSON 解析錯誤。\n\n${parseError.message}\n\n請確認檔案係有效 JSON 格式。`);
                        return;
                    }

                    // 跑 schema validation + migration pipeline
                    let migrated;
                    try {
                        migrated = migrateFormData(rawJson);

                    // 抽出 metadata + cleanup formData
                    const warnings = migrated.__warnings || [];
                    const legacyExtra = migrated.__legacy_extra || {};
                    const schemaVersion = migrated.__schema_version;

                    // Strip metadata 後先 set state
                    const { __schema_version, __legacy_extra, __warnings, ...cleanFormData } = migrated;
                    pushHistory(); // milestone: import JSON
                    setFormData(cleanFormData);

                    // Build user-facing summary
                    let summary = `匯入成功！ (Import Successful)\n\nSchema 版本: ${schemaVersion}`;
                    if (warnings.length > 0) {
                        summary += `\n\n⚠️ 自動處理：\n${warnings.map(w => `• ${w}`).join('\n')}`;
                    }
                    if (Object.keys(legacyExtra).length > 0) {
                        summary += `\n\n📦 保留嘅未知欄位 (debug 用): ${Object.keys(legacyExtra).join(', ')}`;
                    }
                    alert(summary);
                };
                reader.readAsText(file);

                // Clear the input so the same file can be selected again
                event.target.value = '';
            };

                                    className={`hidden md:flex px-token-3 py-token-1.5 rounded-full text-xs font-bold flex items-center gap-token-1.5 tracking-wide ${
                                        lastSavedAt
                                            ? (theme === 'cyber' ? 'text-emerald-400' : 'text-emerald-700')
                                            : (theme === 'cyber' ? 'text-slate-500' : 'text-slate-400')
                                    }`}
                                    title={lastSavedAt ? `上次儲存: ${new Date(lastSavedAt).toLocaleTimeString('zh-HK')}` : '尚未儲存'}
                                >
                                    <Save size={12} />
                                    {lastSavedAt ? `已儲存 ${formatTimeAgo(lastSavedAt)}` : '儲存中...'}
                                </div>
                                {/* Hidden File Input */}
                                <input 
                                    type="file" 
                                    ref={fileInputRef} 
                                    onChange={handleImportJSON} 
                                    accept=".json" 
                                    className="hidden" 
                                />
                            </div>
                        </header>

                        {/* Progress Bar */}
                        <div className="mb-8 max-w-3xl mx-auto">
                            <div className={`flex justify-between text-xs font-bold mb-2 uppercase tracking-wider ${theme === 'cyber' ? 'orbitron text-slate-500' : 'text-slate-400'}`}>
                                <span className={step >= 1 ? (theme === 'cyber' ? "text-cyan-400 text-glow-cyan" : "text-blue-600") : ""}>基本資料</span>
                                <span className={step >= 2 ? (theme === 'cyber' ? "text-cyan-400 text-glow-cyan" : "text-blue-600") : ""}>內容情境</span>
                                <span className={step >= 3 ? (theme === 'cyber' ? "text-cyan-400 text-glow-cyan" : "text-blue-600") : ""}>規則設定</span>
                                <span className={step >= 4 ? (theme === 'cyber' ? "text-cyan-400 text-glow-cyan" : "text-blue-600") : ""}>完成生成</span>
                            </div>
                            <div className={`h-2 rounded-full overflow-hidden ${theme === 'cyber' ? 'bg-slate-800 border border-slate-700/50' : 'bg-slate-200'}`}>
                                <motion.div 
                                    className={`h-full ${
                                        theme === 'cyber' 
                                        ? 'bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-500 shadow-[0_0_10px_rgba(6,182,212,0.5)]'
                                        : 'bg-blue-600'
                                    }`}
                                    initial={{ width: "0%" }}
                                    animate={{ width: `${(step / 4) * 100}%` }}
                                    transition={{ duration: 0.3 }}
                                />
                            </div>
                        </div>

                        {/* Wizard Card - Adjust width for steps */}
                        {step < 4 && (
                            <Card theme={theme} className="min-h-[500px] flex flex-col max-w-3xl mx-auto">
                                <div className="p-token-6 md:p-token-8 flex-1">
                                    <AnimatePresence mode="wait">
                                        {step === 1 && renderStep1()}
                                        {step === 2 && renderStep2()}
                                        {step === 3 && renderStep3()}
                                    </AnimatePresence>
                                </div>

                                {/* Footer Controls */}
                                <div className={`p-token-6 flex justify-between items-center backdrop-blur-sm border-t ${
                                    theme === 'cyber' ? 'bg-slate-900/50 border-slate-800' : 'bg-slate-50 border-slate-100'
                                }`}>
                                    {/* Left Side: Previous Button */}
                                    <div className="w-1/3 flex justify-start">
                                        {step > 1 && (
                                            <button 
                                                onClick={() => setStep(step - 1)}
                                                className={`flex items-center gap-token-2 px-token-6 py-token-3 rounded-xl font-bold transition-all ${
                                                    theme === 'cyber'
                                                    ? 'text-slate-400 hover:text-white hover:bg-slate-800'
                                                    : 'text-slate-600 hover:bg-white hover:shadow-sm border border-transparent hover:border-slate-200'
                                                }`}
                                            >
                                                <ChevronLeft size={20} />
                                                上一步
                                            </button>
                                        )}
                                    </div>

                                    {/* Center: Preview Toggle */}
                                    <div className="w-1/3 flex justify-center">
                                        <button
                                            onClick={() => setPreviewOpen(prev => !prev)}
                                            className={`flex items-center gap-token-2 px-token-4 py-token-2 rounded-xl font-bold transition-all border ${
                                                previewOpen
                                                ? (theme === 'cyber'
                                                    ? 'bg-cyan-900/40 border-cyan-500/50 text-cyan-200'
                                                    : 'bg-blue-50 border-blue-300 text-blue-700')
                                                : (theme === 'cyber'
                                                    ? 'border-slate-700 text-slate-400 hover:bg-slate-800/50 hover:text-cyan-300'
                                                    : 'border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-blue-600')
                                            }`}
                                            title="即時預覽當前設定生成的 prompt output"
                                        >
                                            <Eye size={18} />
                                            {previewOpen ? "隱藏預覽" : "預覽"}
                                        </button>
                                    </div>

                                    {/* Right Side: Next Button */}
                                    <div className="w-1/3 flex justify-end">
                                        <button 
                                            onClick={handleNext}
                                            className={`flex items-center gap-token-2 px-token-8 py-token-3 rounded-xl font-bold transition-all hover:scale-105 active:scale-95 group text-white ${
                                                theme === 'cyber'
                                                ? 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 shadow-[0_0_20px_rgba(6,182,212,0.4)]'
                                                : 'bg-blue-600 hover:bg-blue-700 shadow-md'
                                            }`}
                                        >
                                            下一步
                                            <ChevronRight size={20} className="group-hover:translate-x-1 transition-transform" />
                                        </button>
                                    </div>
                                </div>
                            </Card>
                        )}
                        
                        {/* Live Preview Panel — 任何 step 都可叫出嚟即時睇 prompt output */}
                        {previewOpen && step < 4 && (
                            <motion.div
                                initial={{ opacity: 0, y: 30, scale: 0.95 }}
                                animate={{ opacity: 1, y: 0, scale: 1 }}
                                exit={{ opacity: 0, y: 30, scale: 0.95 }}
                                transition={{ type: "spring", stiffness: 300, damping: 25 }}
                                className="fixed bottom-6 left-6 z-40 w-[min(90vw,560px)] max-h-[70vh] flex flex-col"
                            >
                                <div className={`flex-1 flex flex-col rounded-2xl overflow-hidden border shadow-2xl ${
                                    theme === 'cyber'
                                    ? 'bg-slate-950/95 border-cyan-500/30 backdrop-blur-md shadow-[0_0_30px_rgba(6,182,212,0.2)]'
                                    : 'bg-white border-slate-300'
                                }`}>
                                    {/* Panel header + tabs */}
                                    <div className={`flex items-center justify-between p-token-3 border-b ${
                                        theme === 'cyber' ? 'border-cyan-500/20 bg-slate-900/50' : 'border-slate-200 bg-slate-50'
                                    }`}>
                                        <div className="flex items-center gap-token-2">
                                            <Eye size={16} className={theme === 'cyber' ? 'text-cyan-400' : 'text-blue-600'} />
                                            <span className={`text-sm font-bold tracking-wide ${
                                                theme === 'cyber' ? 'text-cyan-200 orbitron' : 'text-slate-800'
                                            }`}>即時預覽 (Live Preview)</span>
                                        </div>
                                        <div className="flex gap-token-1">
                                            <button
                                                onClick={() => setPreviewTab('design')}
                                                className={`px-token-3 py-token-1 rounded text-xs font-bold transition-all ${
                                                    previewTab === 'design'
                                                    ? (theme === 'cyber' ? 'bg-cyan-500/30 text-cyan-200 ring-1 ring-cyan-500' : 'bg-blue-100 text-blue-700')
                                                    : (theme === 'cyber' ? 'text-slate-400 hover:bg-slate-800' : 'text-slate-600 hover:bg-slate-100')
                                                }`}
                                            >
                                                Part 1: 設計
                                            </button>
                                            <button
                                                onClick={() => setPreviewTab('tech')}
                                                className={`px-token-3 py-token-1 rounded text-xs font-bold transition-all ${
                                                    previewTab === 'tech'
                                                    ? (theme === 'cyber' ? 'bg-cyan-500/30 text-cyan-200 ring-1 ring-cyan-500' : 'bg-blue-100 text-blue-700')
                                                    : (theme === 'cyber' ? 'text-slate-400 hover:bg-slate-800' : 'text-slate-600 hover:bg-slate-100')
                                                }`}
                                            >
                                                Part 2: 技術
                                            </button>
                                        </div>
                                        <button
                                            onClick={() => setPreviewOpen(false)}
                                            className={`p-token-1 rounded transition-colors ${
                                                theme === 'cyber' ? 'text-slate-400 hover:text-white hover:bg-slate-800' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-100'
                                            }`}
                                            title="關閉預覽"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                    {/* Preview content */}
                                    {(() => {
                                        const previewText = previewTab === 'design' ? generateDesignPrompt() : generateTechPrompt();
                                        // Empty state — 當 prompt 太短時顯示引導
                                        const isEmpty = previewText.length < 200;
                                        if (isEmpty) {
                                            return (
                                                <div className={`flex-1 flex flex-col items-center justify-center p-token-8 text-center ${
                                                    theme === 'cyber' ? 'text-slate-400' : 'text-slate-500'
                                                }`} style={{ minHeight: '300px' }}>
                                                    <div className="text-5xl mb-3 opacity-50">📝</div>
                                                    <p className="text-sm mb-2">Prompt 仲未填寫完成</p>
                                                    <p className="text-xs">填寫表單後，呢度會即時顯示 Part {previewTab === 'design' ? '1' : '2'} prompt 嘅完整內容</p>
                                                    <p className="text-xs mt-2 opacity-70">建議：先填寫 2.1 核心用途</p>
                                                </div>
                                            );
                                        }
                                        return (
                                            <textarea
                                                readOnly
                                                value={previewText}
                                                className={`flex-1 w-full font-mono text-xs p-token-4 outline-none resize-none leading-relaxed ${
                                                    theme === 'cyber'
                                                    ? 'bg-slate-950 text-cyan-200'
                                                    : 'bg-white text-slate-700'
                                                }`}
                                                style={{ minHeight: '300px' }}
                                            />
                                        );
                                    })()}
                                    <div className={`text-xs px-token-3 py-token-2 border-t ${
                                        theme === 'cyber' ? 'border-cyan-500/20 text-slate-400 bg-slate-900/30' : 'border-slate-200 text-slate-500 bg-slate-50'
                                    }`}>
                                        💡 Tip: 任何輸入改動都會即時更新預覽。去到 Step 4 可正式複製。
                                    </div>
                                </div>
                            </motion.div>
                        )}

                        {/* Step 4 Rendering (Wide Layout) */}
                        {step === 4 && (
                            <>
                                {renderStep4()}
                                {renderAiResult()}
                            </>
                        )}


                        {/* Extra Links Above Footer */}
                        <div className="mt-12 flex flex-wrap justify-center gap-token-4">
                            {/* Base44 Link */}
                            <a href="https://base44.com/" target="_blank" rel="noopener noreferrer" className={`px-4 py-2 rounded-lg border transition-all text-sm font-medium flex items-center gap-2 ${
                                theme === 'cyber'
                                ? 'border-cyan-500/30 bg-cyan-900/20 text-cyan-300 hover:bg-cyan-500/20 hover:text-cyan-100'
                                : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-blue-600 shadow-sm'
                            }`}>
                                Base44 <ExternalLink size={14} />
                            </a>
                            
                            {/* Emergent Link */}
                            <a href="https://app.emergent.sh/home" target="_blank" rel="noopener noreferrer" className={`px-4 py-2 rounded-lg border transition-all text-sm font-medium flex items-center gap-2 ${
                                theme === 'cyber'
                                ? 'border-purple-500/30 bg-purple-900/20 text-purple-300 hover:bg-purple-500/20 hover:text-purple-100'
                                : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-purple-600 shadow-sm'
                            }`}>
                                Emergent <ExternalLink size={14} />
                            </a>
                            
                            {/* v0.app Link */}
                            <a href="https://v0.app/" target="_blank" rel="noopener noreferrer" className={`px-4 py-2 rounded-lg border transition-all text-sm font-medium flex items-center gap-2 ${
                                theme === 'cyber'
                                ? 'border-slate-500/30 bg-slate-800/20 text-slate-300 hover:bg-slate-700/40 hover:text-slate-100'
                                : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-slate-900 shadow-sm'
                            }`}>
                                v0.app <ExternalLink size={14} />
                            </a>
                            
                            {/* Gemini Link */}
                            <a href="https://gemini.google.com/gem/brainstormer" target="_blank" rel="noopener noreferrer" className={`px-4 py-2 rounded-lg border transition-all text-sm font-medium flex items-center gap-2 ${
                                theme === 'cyber'
                                ? 'border-blue-500/30 bg-blue-900/20 text-blue-300 hover:bg-blue-500/20 hover:text-blue-100'
                                : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-blue-600 shadow-sm'
                            }`}>
                                Gemini <ExternalLink size={14} />
                            </a>

                            {/* Lovable Link */}
                            <a href="https://lovable.dev/" target="_blank" rel="noopener noreferrer" className={`px-4 py-2 rounded-lg border transition-all text-sm font-medium flex items-center gap-2 ${
                                theme === 'cyber'
                                ? 'border-pink-500/30 bg-pink-900/20 text-pink-300 hover:bg-pink-500/20 hover:text-pink-100'
                                : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-pink-600 shadow-sm'
                            }`}>
                                Lovable (不能分享) <ExternalLink size={14} />
                            </a>

                            {/* GitHub Link */}
                            <a href="https://github.com/" target="_blank" rel="noopener noreferrer" className={`px-4 py-2 rounded-lg border transition-all text-sm font-medium flex items-center gap-2 ${
                                theme === 'cyber'
                                ? 'border-zinc-500/30 bg-zinc-900/20 text-zinc-300 hover:bg-zinc-500/20 hover:text-zinc-100'
                                : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-black shadow-sm'
                            }`}>
                                GitHub <Github size={14} />
                            </a>
                        </div>

                        {/* Footer */}
                        <footer className={`mt-6 py-token-6 text-center text-xs font-medium tracking-widest ${
                            theme === 'cyber' ? 'text-slate-600 orbitron' : 'text-slate-400'
                        }`}>
                            © 2025 WMC designed by Ken Cheng | Created with Gemini Script & Tailwind CSS
                        </footer>

                        {/* Floating Action Button (FAB) */}
                        <div className="fixed bottom-6 right-6 z-50">
                            {/* FAB conditional render — 按 formData.fabStyle 切換風格，預覽生成工具嘅效果 */}
                            {formData.fabStyle === "cyber" && (
                                <a
                                    href="https://chengky-bot.github.io/kencheng-homepage/"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className={`flex items-center gap-token-2 px-token-4 py-token-2 rounded-full border backdrop-blur-md transition-all hover:scale-105 group ${
                                        theme === 'cyber'
                                        ? 'border-white/20 bg-gradient-to-r from-cyan-600/80 via-blue-600/80 to-purple-600/80 animate-holo text-white shadow-[0_0_15px_rgba(6,182,212,0.5)] hover:shadow-[0_0_25px_rgba(6,182,212,0.8)]'
                                        : 'bg-white border-slate-200 text-slate-700 shadow-lg hover:shadow-xl'
                                    }`}>
                                    <Monitor size={20} className={theme === 'cyber' ? "group-hover:animate-pulse" : ""} />
                                    <span className="font-bold text-sm tracking-wide text-shadow-sm">{formData.teacherName ? `${formData.teacherName} 設計` : 'Ken Cheng 設計'}</span>
                                    <img src="https://i.imgur.com/OQwyeIV.png" alt="Ken Cheng Signature" className="h-6 w-auto ml-1" />
                                </a>
                            )}
                            {formData.fabStyle === "minimal" && (
                                <a
                                    href="https://chengky-bot.github.io/kencheng-homepage/"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className={`flex items-center gap-token-2 px-token-4 py-token-2 rounded-full border transition-all hover:scale-105 group ${
                                        theme === 'cyber'
                                        ? 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700/80 hover:text-white'
                                        : 'bg-white border-slate-200 text-slate-700 shadow-lg hover:shadow-xl'
                                    }`}>
                                    <Monitor size={18} className={theme === 'cyber' ? "group-hover:animate-pulse" : ""} />
                                    <span className="font-medium text-sm tracking-wide">{formData.teacherName ? `${formData.teacherName} 設計` : 'Ken Cheng 設計'}</span>
                                </a>
                            )}
                            {/* formData.fabStyle === "off" → 完全唔 render */}
                        </div>

                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
