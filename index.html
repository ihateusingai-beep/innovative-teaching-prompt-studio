<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMC TDA 教學設計輔助工具提詞器 (Teaching Design Aids Prompt Builder)</title>

    <!--
        TDA Prompt Builder v3.0 — Vite build pipeline
        - All JS / CSS inlined into single HTML file (via vite-plugin-singlefile)
        - Zero CDN runtime deps (React / Framer / Lucide / Tailwind all bundled)
        - file:// works (pure client-side)
    -->

    <!-- Google Fonts (預先 CDN load — build-time 唔處理 webfont) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (build-time compiled via PostCSS) -->
</head>
<body class="selection:bg-cyan-500 selection:text-white transition-colors duration-500">
    <!-- Background Elements (Only visible in Cyber theme) -->
    <div class="cyber-grid"></div>
    <div class="vignette"></div>

    <div id="root"></div>

    <!-- Main app entry — bundled into single IIFE -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
