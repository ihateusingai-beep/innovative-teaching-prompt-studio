name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # v3.16.0 SMOKE: run unit tests + production-bundle smoke BEFORE build/deploy.
  # Catches ReferenceError class of bug (useMemo import regression) that
  # unit tests + dev-mode jsdom miss but production terser minified build breaks.
  test:
    name: Unit tests + production bundle smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Unit tests (vitest; smoke excluded via npm test script)
        # PATCH 2026-07-17: removed `; echo "EXIT=$?"` hack that masked npm test
        # failures (exit code from `echo` was always 0, so unit test regressions
        # didn't fail CI). Now failures propagate correctly.
        # PATCH 2026-08-27: package.json `test` excludes smoke-* (need dist/);
        # smoke runs in the dedicated post-build step below.
        run: npm test
      - name: Build for production bundle smoke
        # PATCH 2026-07-17: explicit build step before smoke tests. The
        # `test:smoke` script also runs `npm run build` internally, but
        # splitting it out means a build failure shows up as its own step
        # instead of being hidden behind the "dist not found" vitest error
        # (which is misleading — vitest ran fine, dist/ just wasn't created).
        run: npm run build
      - name: Production bundle smoke (jsdom loads dist/index.html, catches ReferenceErrors)
        # Run vitest only (build already done by previous step). We can't
        # use `npm run test:smoke` here because it would re-run the build
        # and double CI time.
        run: npx vitest run --config vitest.config.js tests/smoke-build.test.js tests/smoke-click-coverage.test.js
  build:
    runs-on: ubuntu-latest
    needs: test  # Block deploy if tests / smoke fail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
