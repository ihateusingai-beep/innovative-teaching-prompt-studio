name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # v3.16.0 SMOKE: run unit tests + production-bundle smoke BEFORE build/deploy.
  # Catches ReferenceError class of bug (useMemo import regression) that
  # unit tests + dev-mode jsdom miss but production terser minified build breaks.
  test:
    name: Unit tests + production bundle smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Unit tests (vitest, all *.test.{js,jsx} except smoke)
        run: npm test 2>&1 | tee /tmp/unit-test.log; echo "EXIT=$?"
      - name: Production bundle smoke (jsdom loads dist/index.html, catches ReferenceErrors)
        run: npm run test:smoke
  build:
    runs-on: ubuntu-latest
    needs: test  # Block deploy if tests / smoke fail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
